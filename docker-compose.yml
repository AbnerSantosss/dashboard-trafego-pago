services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trafego
    ports:
      - '127.0.0.1:5460:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o papel app_user (só na primeira subida do volume).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
